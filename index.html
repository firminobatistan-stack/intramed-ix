<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0B218A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INTRAMED IX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Aplicativo Oficial do INTRAMED IX • A.A.A. Cangaceira • Medicina UEMA. Inscrições, placar ao vivo, súmulas e chaveamento." />
    <link rel="apple-touch-icon" href="/assets/atletica/escudo-evento.png" />
    <link rel="icon" type="image/png" href="/assets/atletica/escudo-evento.png" />
    <link rel="preload" as="image" href="/assets/atletica/logo-evento.png" />
    <title>INTRAMED IX • A.A.A. Cangaceira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-brand-surface text-brand-text-primary antialiased selection:bg-brand-blue selection:text-white">
    <div id="root">
      <div id="boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#061245;color:#fff;font-family:Montserrat,system-ui,sans-serif;padding:24px;text-align:center;">
        <img src="/assets/atletica/escudo-evento.png" alt="INTRAMED IX" style="width:72px;height:72px;object-fit:contain;margin-bottom:16px;" />
        <div style="font-weight:800;font-size:18px;letter-spacing:0.08em;">INTRAMED IX</div>
        <div id="boot-status" style="font-size:12px;color:#94a3b8;margin-top:6px;">Carregando aplicativo...</div>
        <button id="boot-reload" type="button" onclick="location.reload()" style="display:none;margin-top:16px;padding:10px 20px;border-radius:12px;border:none;background:#facc15;color:#061245;font-weight:800;font-size:13px;cursor:pointer;">Recarregar Página</button>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var s = document.getElementById('boot-status');
        var b = document.getElementById('boot-reload');
        if (s) s.textContent = 'Não foi possível carregar. Toque abaixo para tentar novamente.';
        if (b) b.style.display = 'inline-block';
      }, { once: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
